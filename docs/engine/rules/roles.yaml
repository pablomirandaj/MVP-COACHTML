# Catálogo de roles y matriz de idoneidad — fcs catalog 1.0.0
# Las puntuaciones son enteros 0–100. Ver docs/15 §7.
catalog_version: 1.0.0
roles:
  TAKER:
    label: Lanzador
    phases: [SP_ATT]
    movements: []
    suitability:
      - { factor: setpiece_role, value: "corner_taker_{side}", weight: 60 }
      - { factor: tag, value: set_piece_specialist, weight: 30 }
      - { factor: foot_matches_requested_swing, weight: 10 }
