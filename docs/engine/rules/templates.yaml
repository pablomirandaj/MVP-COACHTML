# Plantillas de jugadas — DSL FCS-Play 1.0. Ver docs/15 §5.
catalog_version: 1.0.0
templates:
  - template: CRN_ATT_STANDARD
    type: CORNER_ATT
    version: 1.0.0
    params:
      side:        { enum: [LEFT, RIGHT], required: true }
      swing:       { enum: [INSWING, OUTSWING], default: from_taker_foot }   # TECH-SWING-01
      trajectory:  { enum: [DRIVEN, LOFTED], default: DRIVEN }
      target_zone: { enum: [Z_NEAR_POST, Z_FAR_POST, Z_GA_CENTER, Z_PEN_SPOT], default: zone_of_primary_target_else_Z_FAR_POST }  # BALL-TGT-01
    ball_start: { corner_offset_m: 0.5 }
    role_defaults:
      TAKER:            { count: 1, rule: CRN-POS-01 }
      PRIMARY_TARGET:   { count: 1, start_zone: Z_START_CLUSTER, movement: ATTACK_TO_TARGET }
      SECONDARY_TARGET: { count: 2, start_zone: Z_START_CLUSTER, movements: [ATTACK_NEAR_POST, ATTACK_PEN_SPOT] }
      DECOY:            { count: 1, start_zone: Z_START_CLUSTER, movement: DECOY_RUN }
      GK_SCREEN:        { count: 1, start_zone: Z_GK, movement: HOLD }
      REBOUND:          { count: 2, start_zone: Z_REBOUND, movement: HOLD }
      REST_DEFENDER:    { count: 2, start_zone: Z_REST, movement: HOLD, rule: CRN-POS-07 }
    # Suma de defaults = 10 jugadores de campo + portero propio (no aparece en ABP ofensivo salvo vista completa).
    fill_order: [TAKER, REST_DEFENDER, PRIMARY_TARGET, BLOCKER, SECONDARY_TARGET, REBOUND, DECOY, GK_SCREEN]
    outfield_total: 10
    opponents_default: OPP_CORNER_DEF_MIXED
    constraints: [LAW-CRN-01, LAW-CRN-02, LAW-CRN-03, GEO-01, GEO-02, GEO-03, GEO-SPACING-01, TECH-SWING-01, TAC-CRN-REST-01, TAC-CRN-TGT-01, SEQ-SCREEN-01, SCH-SYNC-01, SEQ-CONSTR-01]

  - template: FK_WIDE_ATT_STANDARD
    type: FK_WIDE_ATT
    version: 1.0.0
    description: "Falta lateral a favor. Rematadores salen desde la línea de fuera de juego; nadie arranca antes del golpeo."
    params:
      side:        { enum: [LEFT, RIGHT], required: true }
      depth_m:     { min: 0, max: 35, default: 18 }    # distancia a la línea de fondo
      distance_m:  { min: 2, max: 25, default: 8 }     # distancia a la línea de banda
      swing:       { enum: [INSWING, OUTSWING], default: from_taker_foot }
      target_zone: { enum: [Z_NEAR_POST, Z_FAR_POST, Z_GA_CENTER, Z_PEN_SPOT], default: zone_of_primary_target_else_Z_FAR_POST }
    offside_line: { gap_ratio: 0.4, min_gap_m: 6, max_gap_m: 12, max_x_from_goal_m: 7 }
    wall: { players: 2, distance_m: 9.15 }
    role_defaults:
      TAKER:            { count: 1, rule: FK-POS-01 }
      PRIMARY_TARGET:   { count: 1, movement: ATTACK_TO_TARGET }
      SECONDARY_TARGET: { count: 3, movements: [ATTACK_NEAR_POST, ATTACK_PEN_SPOT, ATTACK_GA_CENTER] }
      DECOY:            { count: 1, movement: DECOY_RUN }
      REBOUND:          { count: 1, start_zone: Z_REBOUND, movement: HOLD }
      REST_DEFENDER:    { count: 2, start_zone: Z_REST, movement: HOLD, rule: CRN-POS-07 }
    fill_order: [TAKER, REST_DEFENDER, PRIMARY_TARGET, SECONDARY_TARGET, REBOUND, DECOY]
    outfield_total: 10
    opponents_default: OPP_FK_WIDE_DEF
    constraints: [LAW-FK-01, LAW-OFF-01, GEO-01, GEO-02, GEO-03, GEO-SPACING-01, TECH-SWING-01, TACTICAL-FK-01, SCH-SYNC-01, ROSTER-01]

  - template: OPP_FK_WIDE_DEF
    type: FK_WIDE_DEF
    team: OPP
    version: 1.0.0
    description: "Defensa rival genérica de una falta lateral: portero, barrera de 2, línea a la altura del fuera de juego y un hombre de salida."
    actors: computed

  - template: THR_ATT_LONG
    type: THROW_IN_ATT
    version: 1.0.0
    description: "Saque de banda largo al primer palo: el rematador del primer palo peina y un compañero bloquea a su marca."
    params:
      side:       { enum: [LEFT, RIGHT], required: true }
      distance_m: { min: 0, max: 40, default: 18 }   # distancia a la línea de fondo
    role_defaults:
      TAKER:            { count: 1, rule: THR-POS-01 }
      PRIMARY_TARGET:   { count: 1, movement: ATTACK_NEAR_POST }
      BLOCKER:          { count: 1 }
      SECONDARY_TARGET: { count: 2, start_zone: Z_START_CLUSTER, movements: [ATTACK_FAR_POST, ATTACK_PEN_SPOT] }
      REBOUND:          { count: 2, start_zone: Z_REBOUND, movement: HOLD }
      REST_DEFENDER:    { count: 2, start_zone: Z_REST, movement: HOLD, rule: CRN-POS-07 }
    fill_order: [TAKER, REST_DEFENDER, PRIMARY_TARGET, BLOCKER, SECONDARY_TARGET, REBOUND]
    outfield_total: 10
    opponents_default: OPP_CORNER_DEF_MIXED
    constraints: [LAW-THR-01, GEO-01, GEO-02, GEO-03, GEO-SPACING-01, SEQ-SCREEN-01, SCH-SYNC-01, ROSTER-01]

  - template: THR_ATT_SHORT
    type: THROW_IN_ATT
    version: 1.0.0
    description: "Saque de banda corto con tercer hombre: apoyo corto, devolución al lanzador y pase a la espalda del lateral."
    params:
      side:       { enum: [LEFT, RIGHT], required: true }
      distance_m: { min: 10, max: 70, default: 32 }
    pass_speed_mps: 14
    constraints: [LAW-THR-01, GEO-01, GEO-02, GEO-03, ROSTER-01]

  # Balón parado en contra. Coordenadas de zona: [metros desde la línea de gol, metros hacia el primer palo desde el centro].
  - template: CRN_DEF_MIXED
    type: CORNER_DEF
    version: 1.0.0
    description: "Defensa mixta: 3 en zona (primer palo, frontal del área pequeña y centro) y el resto al hombre."
    zonal: [[1.0, 3.2], [5.0, 2.5], [4.5, 0.0]]
    markers: all_box_attackers
    extra: [EDGE_GUARD, COUNTER_OUTLET]
  - template: CRN_DEF_ZONAL
    type: CORNER_DEF
    version: 1.0.0
    description: "Defensa zonal: 7 en zona escalonada, uno en la frontal, uno para el córner en corto y uno arriba."
    zonal: [[1.0, 3.2], [5.0, 2.5], [4.5, 0.0], [5.0, -2.5], [10.0, 3.0], [10.0, -3.0], [1.5, -3.4]]
    markers: none
    extra: [EDGE_GUARD, POST_GUARD, COUNTER_OUTLET]
  - template: CRN_DEF_MAN
    type: CORNER_DEF
    version: 1.0.0
    description: "Defensa al hombre: un zonal en el primer palo, marcas individuales y dos coberturas."
    zonal: [[1.0, 3.2]]
    markers: all_box_attackers
    extra: [EDGE_GUARD, COUNTER_OUTLET, COVER, COVER]
  - template: FK_DEF_STANDARD
    type: FK_WIDE_DEF
    version: 1.0.0
    description: "Falta lateral en contra: barrera de 2, línea a la altura del fuera de juego, marcas a sus rematadores y uno arriba."
    wall: { players: 2, distance_m: 9.15 }
    markers: all_box_attackers
    extra: [ZONAL_LINE, ZONAL_LINE, COUNTER_OUTLET]
  - template: OPP_SETPIECE_ATT
    type: CORNER_ATT
    team: OPP
    version: 1.0.0
    description: "Ataque rival genérico para practicar la defensa: 5 rematadores, uno en la frontal y dos que se quedan atrás. No es una predicción."
    box_runs: [ATTACK_NEAR_POST, ATTACK_FAR_POST, ATTACK_PEN_SPOT, ATTACK_GA_CENTER, LATE_ARRIVAL]

  - template: OPP_CORNER_DEF_MIXED
    type: CORNER_DEF
    team: OPP
    version: 1.0.0
    description: Defensa rival por defecto para visualizar un córner ofensivo. Representación genérica, no predicción.
    actors:
      - { role: GOALKEEPER,     at: [104.2, 34] }
      - { role: ZONAL_DEFENDER, at: [103.5, 30.0] }
      - { role: ZONAL_DEFENDER, at: [103.5, 34.0] }
      - { role: ZONAL_DEFENDER, at: [103.5, 38.0] }
      - { role: ZONAL_DEFENDER, at: [100.5, 32.0] }
      - { role: ZONAL_DEFENDER, at: [100.5, 36.5] }
      - { role: ZONAL_DEFENDER, at: [98.0,  26.0] }   # frente al primer palo
      - { role: MAN_MARKER, marks: PRIMARY_TARGET,   offset: goal_side_1m }
      - { role: MAN_MARKER, marks: SECONDARY_TARGET, index: 0, offset: goal_side_1m }
      - { role: MAN_MARKER, marks: SECONDARY_TARGET, index: 1, offset: goal_side_1m }
      - { role: COUNTER_OUTLET, at: [70, 34] }

  - template: CRN_DEF_MIXED
    type: CORNER_DEF
    version: 1.0.0
    params:
      side: { enum: [LEFT, RIGHT], required: true }   # lado desde el que saca el rival
      zonal_count: { int: [3, 7], default: 5 }
      man_count:   { int: [0, 5], default: 3 }
      post_guard:  { enum: [NONE, NEAR, BOTH], default: NEAR }
      outlets:     { int: [0, 2], default: 1 }
    role_defaults:
      GOALKEEPER:     { count: 1 }
      ZONAL_DEFENDER: { count: "{zonal_count}", zone_line: six_yard_line_and_penalty_spot }
      MAN_MARKER:     { count: "{man_count}" }
      POST_GUARD:     { count: "{post_guard == NEAR ? 1 : post_guard == BOTH ? 2 : 0}" }
      EDGE_GUARD:     { count: 1 }
      COUNTER_OUTLET: { count: "{outlets}" }
    fill_order: [GOALKEEPER, ZONAL_DEFENDER, MAN_MARKER, POST_GUARD, EDGE_GUARD, COUNTER_OUTLET]
    outfield_total: 10
    constraints: [GEO-01, GEO-02, GEO-03, TAC-CRNDEF-01]
